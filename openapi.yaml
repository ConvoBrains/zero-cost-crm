openapi: 3.1.0

info:
  title: Zero Cost CRM API
  version: 1.1.0
#___________________________Components________________________
components:
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    TooManyRequests:
      description: Too many requests. Please try again later.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, invalid, or expired bearer token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    InvalidCredentials:
      description: Invalid email or password.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Forbidden:
      description: Insufficient permissions.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - name
        - role
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/UserRoles"
    UserRoles:
      type: string
      enum:
        - founder
        - sdr
        - admin
    DiscoveryQuestion:
      type: object
      required:
        - id
        - section
        - prompt
        - input
      properties:
        id:
          type: string
        section:
          type: string
        prompt:
          type: string
        input:
          type: string
          enum:
            - text
            - textarea
            - number

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string

    ConfigResponse:
      type: object
      required:
        - brandName
        - brandTagline
        - logoUrl
        - stages
        - contactStatuses
        - championStatusToStage
        - discoveryQuestions
        - allowedEmailDomain
        - allowedEmailDomains
        - allowAnyEmailDomain
      properties:
        brandName:
          type: string
        brandTagline:
          type: string
        logoUrl:
          type: string
        stages:
          type: array
          items:
            type: string
        contactStatuses:
          type: array
          items:
            type: string
        championStatusToStage:
          type: object
          additionalProperties:
            type:
              - string
              - "null"
        discoveryQuestions:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryQuestion"
        allowedEmailDomain:
          type:
            - string
            - "null"
        allowedEmailDomains:
          type: array
          items:
            type: string
        allowAnyEmailDomain:
          type: boolean

    SettingsPatch:
      type: object
      properties:
        brandName:
          type: string
        brandTagline:
          type: string
        logoUrl:
          type: string
        stages:
          type: array
          items:
            type: string
        contactStatuses:
          type: array
          items:
            type: string
        championStatusToStage:
          type: object
          additionalProperties:
            type:
              - string
              - "null"
        discoveryQuestions:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryQuestion"
    SettingsResponse:
      type: object
      required:
        - brandName
        - brandTagline
        - logoUrl
        - stages
        - contactStatuses
        - championStatusToStage
        - discoveryQuestions
        - updatedAt
      properties:
        brandName:
          type: string
        brandTagline:
          type: string
        logoUrl:
          type: string
        stages:
          type: array
          items:
            type: string
        contactStatuses:
          type: array
          items:
            type: string
        championStatusToStage:
          type: object
          additionalProperties:
            type:
              - string
              - "null"
        discoveryQuestions:
          type: array
          items:
            $ref: "#/components/schemas/DiscoveryQuestion"
        updatedAt:
          type:
            - string
            - "null"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          description: User email address.
          format: email
          example: alice@example.com
        password:
          type: string
          format: password
          description: User password.
    LoginResponse:
      type: object
      required:
        - token
        - user
      properties:
        token:
          type: string
          description: JWT bearer token
        user:
          $ref: "#/components/schemas/User"


#_____________________ Security _____________________

    HeartBeatResponse:
      type: object
      required:
        - ok
        - lastActiveAt
      properties:
        ok:
          type: boolean
          example: true
        lastActiveAt:
          type: string
          format: date-time

security: #as mentioned in API.md, all endpoints require auth
  - bearerAuth: []
#_____________________ Paths ______________________
paths:
  #=========================
  # PUBLIC ENDPOINTS
  #=========================
  /api/health:
    get:
      security: []
      summary: Health check endpoint
      responses:
        "200":
          description: Successful health check
          content:
            application/json:
              schema:
                type: object
                required:
                  - ok
                properties:
                  ok:
                    type: boolean
                    description: Indicates whether the API server is healthy.
                    example: true
  /api/config:
    get:
      security: []
      summary: Public instance configuration
      responses:
        "200":
          description: Successful config response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfigResponse"
        "500":
          description: Failed to load config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/settings:
    patch:
      summary: Update application settings.
      description: Requires an authenticated admin user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsPatch"
      responses:
        "200":
          description: Application settings updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsResponse"
        "400":
          description: Application settings failed. (Invalid settings)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  #=========================
  # AUTH ENDPOINTS
  #=========================
  /api/auth/login:
    post:
      security: []
      summary: User login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Successful user login.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Email address is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/InvalidCredentials"
        "429":
          $ref: "#/components/responses/TooManyRequests"
  /api/auth/logout:
    post:
      summary: End session
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  enum:
                    - idle
                    - expired
                    - manual
      responses:
        "204":
          description: Successful logout.
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/heartbeat:
    post:
      summary: Touch active session.
      responses:
        "200":
          description: Session is valid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HeartBeatResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/auth/me:
    get:
      summary: Current user
      responses:
        "200":
          description: Contains current user object.
          content:
            application/json:
              schema:
                type: object
                required:
                  - user
                properties:
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  #=========================
  # Users ENDPOINTS
  #=========================
  /api/users/roles:
    get:
      summary: Allowed user roles.
      description: Requires an authenticated admin user.
      responses:
        "200":
          description: Returns the list of allowed roles.
          content:
            application/json:
              schema:
                type: object
                required:
                  - roles
                properties:
                  roles:
                    type: array
                    items:
                      $ref: "#/components/schemas/UserRoles"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

